<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test History Load</title>
<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  max-width: 1200px;
  margin: 40px auto;
  padding: 20px;
  background: #f5f5f5;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h1 {
  color: #333;
  margin-bottom: 20px;
}
.input-group {
  margin-bottom: 20px;
}
label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #555;
}
input {
  width: 100%;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
}
button {
  background: #3d52a0;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}
button:hover {
  background: #2a3a70;
}
.result {
  margin-top: 30px;
  padding: 20px;
  background: #f9f9f9;
  border-radius: 8px;
  border: 1px solid #ddd;
}
.error {
  background: #fee;
  border-color: #fcc;
  color: #c33;
}
.success {
  background: #efe;
  border-color: #cfc;
  color: #363;
}
pre {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
  line-height: 1.5;
}
.geometry-elements {
  margin-top: 20px;
}
.element {
  padding: 10px;
  margin: 8px 0;
  background: white;
  border-left: 3px solid #3d52a0;
  border-radius: 4px;
}
.element-label {
  font-weight: 600;
  color: #3d52a0;
  margin-bottom: 4px;
}
.element-value {
  color: #555;
}
img {
  max-width: 100%;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
  <h1>🧪 Test History Load Feature</h1>
  <p style="color: #666; margin-bottom: 30px;">
    Test the <code>GET /geometry/problem/{id}</code> endpoint and verify all data displays correctly.
  </p>

  <div class="input-group">
    <label for="problemId">Problem ID (maBaiToan):</label>
    <input type="number" id="problemId" placeholder="Enter problem ID (e.g., 1, 2, 3...)" value="1">
  </div>

  <button onclick="testLoadProblem()">🔍 Load Problem</button>

  <div id="result"></div>
</div>

<script>
const API_BASE_URL = 'http://127.0.0.1:8000';

async function testLoadProblem() {
  const problemId = document.getElementById('problemId').value;
  const resultDiv = document.getElementById('result');
  
  if (!problemId) {
    resultDiv.innerHTML = '<div class="result error">❌ Please enter a problem ID</div>';
    return;
  }
  
  resultDiv.innerHTML = '<div class="result">⏳ Loading problem data...</div>';
  
  try {
    const response = await fetch(`${API_BASE_URL}/geometry/problem/${problemId}`);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    console.log('Problem data:', data);
    
    // Display results
    let html = '<div class="result success">';
    html += '<h2>✅ Problem Loaded Successfully</h2>';
    
    // Basic Info
    html += '<h3>📋 Basic Info (baiToan)</h3>';
    html += `<p><strong>ID:</strong> ${data.baiToan.maBaiToan}</p>`;
    html += `<p><strong>User ID:</strong> ${data.baiToan.maNguoiDung || 'N/A'}</p>`;
    html += `<p><strong>Type:</strong> ${data.baiToan.loaiHinh || 'N/A'}</p>`;
    html += `<p><strong>Date:</strong> ${data.baiToan.ngayTao || 'N/A'}</p>`;
    html += `<p><strong>Summary:</strong> ${data.baiToan.tomTatDe || 'N/A'}</p>`;
    
    // Image
    if (data.baiToan.duongDan) {
      html += '<h3>🖼️ Image</h3>';
      html += `<p><strong>Path:</strong> ${data.baiToan.duongDan}</p>`;
      html += `<img src="${API_BASE_URL}${data.baiToan.duongDan}" alt="Problem image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">`;
      html += `<p style="display:none; color: #c33;">❌ Image failed to load. Check if file exists at: ${data.baiToan.duongDan}</p>`;
    }
    
    // Recognized Text
    if (data.baiToan.deBaiTho) {
      html += '<h3>📝 Recognized Text (deBaiTho)</h3>';
      html += `<p style="line-height: 1.6;">${data.baiToan.deBaiTho}</p>`;
    }
    
    // Geometry Elements (5-6 items)
    if (data.extraction) {
      html += '<h3>🔷 Geometry Elements (extraction)</h3>';
      html += '<div class="geometry-elements">';
      
      // 1. Hình dạng
      if (data.extraction.problem_type) {
        html += '<div class="element">';
        html += '<div class="element-label">1. Hình dạng (Shape)</div>';
        html += `<div class="element-value">${data.extraction.problem_type}</div>`;
        html += '</div>';
      }
      
      // 2-5. Given conditions
      if (data.extraction.given_conditions && data.extraction.given_conditions.length > 0) {
        data.extraction.given_conditions.forEach((condition, index) => {
          const label = condition.includes('hình vuông') || condition.includes('hình chữ nhật') ? 'Đáy (Base)' :
                       condition.includes('⊥') || condition.includes('vuông góc') ? 'Vuông góc (Perpendicular)' :
                       condition.includes('trung điểm') ? 'Trung điểm (Midpoint)' :
                       condition.includes('=') || condition.includes('khoảng cách') ? 'Độ dài (Length/Distance)' :
                       `Điều kiện ${index + 1}`;
          
          html += '<div class="element">';
          html += `<div class="element-label">${index + 2}. ${label}</div>`;
          html += `<div class="element-value">${condition}</div>`;
          html += '</div>';
        });
      }
      
      // 6. Yêu cầu
      if (data.extraction.questions && data.extraction.questions.length > 0) {
        html += '<div class="element">';
        html += `<div class="element-label">${data.extraction.given_conditions.length + 2}. Yêu cầu (Requirement)</div>`;
        html += `<div class="element-value">${data.extraction.questions[0]}</div>`;
        html += '</div>';
      }
      
      html += '</div>';
    }
    
    // Points
    if (data.extraction && data.extraction.points && data.extraction.points.length > 0) {
      html += '<h3>📍 Points</h3>';
      html += `<p>${data.extraction.points.join(', ')}</p>`;
    }
    
    // Relationships
    if (data.extraction && data.extraction.relationships && data.extraction.relationships.length > 0) {
      html += '<h3>🔗 Relationships</h3>';
      html += '<ul>';
      data.extraction.relationships.forEach(rel => {
        html += `<li><strong>${rel.type}:</strong> ${rel.entities.join(', ')}</li>`;
      });
      html += '</ul>';
    }
    
    // Solution (if available)
    if (data.loiGiai) {
      html += '<h3>💡 Solution (loiGiai)</h3>';
      try {
        const steps = JSON.parse(data.loiGiai.cacBuocGiai || '[]');
        if (steps.length > 0) {
          html += '<ol>';
          steps.forEach(step => {
            html += `<li>${step}</li>`;
          });
          html += '</ol>';
        }
        html += `<p><strong>Result:</strong> ${data.loiGiai.ketQuaCuoi || 'N/A'}</p>`;
      } catch (e) {
        html += '<p style="color: #c33;">Error parsing solution data</p>';
      }
    }
    
    // Raw JSON
    html += '<h3>📦 Raw JSON Response</h3>';
    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    
    html += '</div>';
    
    resultDiv.innerHTML = html;
    
  } catch (error) {
    console.error('Error:', error);
    resultDiv.innerHTML = `
      <div class="result error">
        <h2>❌ Error Loading Problem</h2>
        <p><strong>Error:</strong> ${error.message}</p>
        <p><strong>Problem ID:</strong> ${problemId}</p>
        <p><strong>Endpoint:</strong> ${API_BASE_URL}/geometry/problem/${problemId}</p>
        <h3>Troubleshooting:</h3>
        <ul>
          <li>Check if backend is running on port 8000</li>
          <li>Verify problem ID exists in database</li>
          <li>Check browser console for CORS errors</li>
          <li>Ensure database connection is working</li>
        </ul>
      </div>
    `;
  }
}

// Auto-load on page load if URL has ?id=X
window.addEventListener('DOMContentLoaded', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const problemId = urlParams.get('id');
  
  if (problemId) {
    document.getElementById('problemId').value = problemId;
    testLoadProblem();
  }
});
</script>

</body>
</html>
